<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iza Nunes</title>
<meta name="description" content="Skincare, autocuidado e beleza com review sincero. Os achados que a Iza usa e indica.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --fundo: #f7f3ee;
    --texto: #1f1b18;
    --suave: #8b7d72;
    --linha: #d9cfc4;
    --dourado: #b89b72;
    --tinta: #4a3226;
    --sobre-tinta: #f7f3ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #161311;
      --texto: #f2ece4;
      --suave: #a89a8e;
      --linha: #3a322c;
      --dourado: #c9ad84;
      --tinta: #5c4030;
      --sobre-tinta: #f2ece4;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--fundo);
    color: var(--texto);
    font-family: "Jost", "Avenir Next", system-ui, sans-serif;
    font-weight: 300;
    display: flex;
    justify-content: center;
    padding: 56px 16px 40px;
    min-height: 100vh;
  }
  main { width: 100%; max-width: 420px; text-align: center; }
  .foto {
    width: 128px; height: 128px; border-radius: 50%;
    object-fit: cover; display: block; margin: 0 auto;
    padding: 4px; border: 1px solid var(--dourado); background: var(--fundo);
  }
  h1 {
    font-family: "Cormorant Garamond", Didot, Georgia, serif;
    font-weight: 300; font-size: 44px; letter-spacing: 6px;
    text-transform: uppercase; margin: 26px 0 4px; line-height: 1.05;
  }
  .sub {
    font-family: "Cormorant Garamond", Didot, Georgia, serif;
    font-style: italic; font-weight: 300; font-size: 21px;
    color: var(--suave); margin: 0;
  }
  .fio { width: 40px; height: 1px; background: var(--dourado); margin: 22px auto; border: 0; }
  .bio {
    color: var(--suave); font-size: 11.5px; letter-spacing: 2.4px;
    text-transform: uppercase; margin: 0 0 34px; line-height: 2;
  }
  a.botao {
    display: block; text-decoration: none; color: var(--texto);
    border: 1px solid var(--linha); border-radius: 2px;
    padding: 18px 20px; margin: 0 0 14px;
    font-size: 12.5px; letter-spacing: 2.2px; text-transform: uppercase; font-weight: 400;
    transition: border-color .2s ease, background .2s ease;
  }
  a.botao:hover, a.botao:focus { border-color: var(--dourado); outline: none; }
  a.destaque { background: var(--tinta); border-color: var(--tinta); color: var(--sobre-tinta); }
  a.destaque:hover, a.destaque:focus { background: var(--tinta); border-color: var(--dourado); }
  a.botao small {
    display: block; margin-top: 6px;
    font-family: "Cormorant Garamond", Georgia, serif; font-style: italic;
    font-size: 16px; letter-spacing: 0.3px; text-transform: none; opacity: .85;
  }
  .redes { margin: 30px 0 0; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; }
  .redes a { color: var(--suave); text-decoration: none; border-bottom: 1px solid var(--linha); padding-bottom: 2px; }
  footer {
    margin-top: 44px; font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic; font-size: 15px; color: var(--suave);
  }
</style>
</head>
<body>
<main>
  <img class="foto" src="foto.jpg" alt="Iza Nunes" onerror="this.style.display='none'">
  <h1>Iza Nunes</h1>
  <p class="sub">minha vida além da harmonização facial</p>
  <hr class="fio">
  <p class="bio">Skincare · autocuidado · treino · beleza<br>com review sincero</p>

  <a class="botao destaque" href="https://whatsapp.com/channel/0029VbEYVYF3LdQcNWQCnG22">
    Canal de achados no WhatsApp
    <small>ofertas e achados que eu testo, todo dia</small>
  </a>

  <!-- Achados da Shopee: um bloco <a> por produto, com o link de afiliado gerado no app da Shopee.
       Se entrar link de afiliado direto nesta pagina, volta o aviso #publi no rodape (regra CONAR).
  <a class="botao" href="LINK_SHOPEE">
    Nome do produto
    <small>Por que eu indico, em uma frase</small>
  </a>
  -->

  <a class="botao" href="https://www.tiktok.com/@izasnunes">
    TikTok @izasnunes
    <small>vídeos e a minha vitrine do TikTok Shop</small>
  </a>

  <p class="redes"><a href="https://www.instagram.com/izasnunes/">Instagram</a></p>

  <footer>Iza Nunes</footer>
</main>
</body>
</html>
